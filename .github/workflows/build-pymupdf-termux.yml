name: Build pymupdf wheel for Termux (aarch64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pymupdf_version:
        description: "Versi pymupdf (kosongkan = terbaru)"
        required: false
        default: ""

jobs:
  build:
    # Native ARM64, gratis untuk repo publik, tanpa emulasi QEMU
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Pull termux-docker image (aarch64, native)
        run: docker pull termux/termux-docker:aarch64

      - name: Build wheel di dalam Termux container
        run: |
          mkdir -p ${{ github.workspace }}/dist
          docker run --rm --privileged \
            -e PYMUPDF_VERSION="${{ github.event.inputs.pymupdf_version }}" \
            -v ${{ github.workspace }}/dist:/data/data/com.termux/files/home/dist \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -euxo pipefail
              pkg update -y
              pkg install -y python clang make swig binutils pkg-config \
                              libjpeg-turbo freetype

              python -m pip install --upgrade pip wheel setuptools

              cd ~
              if [ -n "${PYMUPDF_VERSION:-}" ]; then
                PKG="pymupdf==$PYMUPDF_VERSION"
              else
                PKG="pymupdf"
              fi

              export CC=clang
              export CXX=clang++
              export MUPDF_SETUP_USE_CLANG_PYTHON=0
              export MUPDF_SETUP_USE_SWIG=1
              export PYMUPDF_SETUP_SWIG="$(command -v swig)"
              export CFLAGS="-O1 -pipe"
              export CXXFLAGS="-O1 -pipe"

              python -m pip wheel "$PKG" -w ~/dist --no-deps --no-build-isolation -v
              cp ~/dist/*.whl /data/data/com.termux/files/home/dist/
            '

      - name: Tampilkan hasil wheel
        run: ls -la ${{ github.workspace }}/dist

      - name: Upload artifact (selalu, walau bukan tag)
        uses: actions/upload-artifact@v4
        with:
          name: pymupdf-termux-aarch64-wheel
          path: ${{ github.workspace }}/dist/*.whl

      - name: Upload wheel ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/dist/*.whl

# Cara pakai:
#   git tag v1.24.14   (samakan dengan versi pymupdf yang mau di-build)
#   git push origin v1.24.14
#
# Atau trigger manual lewat tab Actions -> Run workflow, isi versi
# di kolom input (kosongkan untuk versi terbaru).
#
# Wheel hasil build ada di tab Artifacts run tsb, atau di GitHub
# Release kalau trigger via tag. Install di Termux dengan:
#   pip install <url_atau_path_ke_.whl>
